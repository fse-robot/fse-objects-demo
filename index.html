<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Объекты · NONFIRE</title>
<meta name="description" content="Демо раздела «Объекты» NONFIRE. Данные примерные.">
<link rel="icon" href="nonfire-logo.png">
<style>
:root{
  --bg:#F2F4F7;--card:#FFFFFF;--ink:#111827;--mut:#4B5563;--line:#E3E7ED;--field:#8A94A6;--soft:#EEF1F5;
  --red:#C8281C;--redbg:#D7261B;--redsoft:#FDECEA;--blue:#1D5BB0;--bluesoft:#E8F0FB;--green:#1B7A3E;--amber:#8A5300;
  --sh:0 1px 2px rgba(16,24,40,.06),0 4px 12px rgba(16,24,40,.06);--r:14px;
  color-scheme:light;
}
[data-theme=d]{
  --bg:#0F1520;--card:#1A2230;--ink:#F2F5F9;--mut:#B7C0CE;--line:#2C3747;--field:#6B7688;--soft:#232D3D;
  --red:#FF7A6E;--redbg:#D7261B;--redsoft:#3A1F22;--blue:#86B6FF;--bluesoft:#1E2C44;--green:#6FD08F;--amber:#F2B54A;
  --sh:none;color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* каркас */
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:60px}
.logo{display:inline-flex;align-items:center;background:#fff;border-radius:8px;padding:5px 8px;border:1px solid #E3E7ED}
.logo img{display:block;height:26px;width:auto}
.sp{flex:1}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:hover{background:var(--soft)}
.srch{display:none;align-items:center;gap:8px;height:44px;padding:0 12px;border:1px solid var(--field);border-radius:12px;background:var(--card);flex:1;max-width:420px}
.srch input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px}
.srch input::placeholder{color:var(--mut)}
.srow{padding:12px 16px 0}.srow .srch{display:flex;max-width:none}
.who{display:none;align-items:center;gap:10px;font-weight:600}
.ava{width:36px;height:36px;border-radius:50%;background:var(--bluesoft);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:15px;flex:none}
main{padding:16px 16px 104px;max-width:1680px;margin:0 auto}
.hd{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
h1{font-size:28px;line-height:1.15;font-weight:800;letter-spacing:-.02em}
.add{display:none;align-items:center;gap:6px;height:44px;padding:0 18px 0 14px;border-radius:12px;background:var(--redbg);color:#fff;font-weight:700}
.add:hover{background:#B81F15}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:18px;background:var(--redbg);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(200,40,28,.35);z-index:6}
.fab svg.i{width:28px;height:28px}
/* переключатель */
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{white-space:nowrap;height:40px;padding:0 14px;border-radius:9px;display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mut)}
.seg button svg.i{width:20px;height:20px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
[data-theme=d] .seg button[aria-pressed=true]{background:#2E3A4E}
.seg .n{font-weight:500;color:var(--mut);font-size:14px}
/* итоги */
.tot{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);padding:4px 16px;margin-bottom:16px}
.tot div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0}
.tot div+div{border-top:1px solid var(--line)}
.tot span{color:var(--mut);font-size:15px}
.tot b{font-size:20px;font-weight:800;letter-spacing:-.01em;text-align:right;font-variant-numeric:tabular-nums}
.tot b.r{color:var(--ink)}
/* список */
:root{--s0:#64748B;--s1:#0E7490;--s2:#1D5BB0;--s3:#4F46E5;--s4:#7C3AED;--s5:#C026D3;--s6:#B45309;--s7:#CA8A04;--s8:#0F766E;--s9:#65A30D;--s10:#15803D;--s11:#9CA3AF}
[data-theme=d]{--s0:#94A3B8;--s1:#22B8D6;--s2:#6FA3FF;--s3:#8B85FF;--s4:#A98BFF;--s5:#E879F9;--s6:#F08A3C;--s7:#EAB308;--s8:#2DD4BF;--s9:#A3E635;--s10:#4ADE80;--s11:#6B7280}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;grid-template-areas:"nm nm nm nm" "id rs re ok";align-items:center;gap:4px 8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;text-align:left;width:100%}
.row:hover{border-color:var(--field)}
.c-nm{grid-area:nm;display:flex;align-items:center;gap:8px;min-width:0}
.c-id{grid-area:id}.c-rs{grid-area:rs;color:var(--mut);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-re{grid-area:re;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.c-ok{grid-area:ok;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.c-st,.c-bl,.c-du,.c-to{display:none}
.nm{font-size:17px;font-weight:700;line-height:1.3;text-wrap:pretty}
.sd{flex:none;width:10px;height:10px;border-radius:50%}
.dot{display:block;width:10px;height:10px;border-radius:50%;background:var(--green)}.dot.late{background:var(--red)}
.bw{display:flex;color:var(--amber)}.bw svg.i{width:18px;height:18px}
.meta{color:var(--mut);font-size:15px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.id{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14px;color:var(--mut);white-space:nowrap}
.od{color:var(--red)!important;font-weight:700}
.od svg.i{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;background:var(--soft);font-size:14px;font-weight:600;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip i{flex:none;width:8px;height:8px;border-radius:50%}
.rhead{display:none}
/* по этапам */
.cols{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;margin:0 -16px;padding-left:16px;padding-right:16px}
.col{flex:0 0 280px;scroll-snap-align:start;display:flex;flex-direction:column;gap:8px}
.colh{padding:4px 4px 6px;border-bottom:3px solid var(--blue)}
.colh.done{border-color:var(--green)}.colh.stop{border-color:var(--amber)}
.colh b{display:flex;justify-content:space-between;gap:8px;font-size:16px}
.colh b span{color:var(--mut);font-weight:600}
.colh small{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;width:100%}
.tile:hover{border-color:var(--field)}
.tile .t{font-weight:700;line-height:1.3}
.tile .f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.tile .f b{font-variant-numeric:tabular-nums;white-space:nowrap}
.tile .ic{display:flex;gap:4px;color:var(--amber)}
.tile .ic .od{display:flex}
.tile svg.i{width:20px;height:20px}
.none{border:1px dashed var(--line);border-radius:12px;padding:14px;color:var(--mut);text-align:center;font-size:15px}
/* пусто, загрузка */
.empty{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:48px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ci{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;color:var(--mut)}
.empty b{font-size:20px}
.empty .add{display:inline-flex}
.sk{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.sk i{display:block;height:14px;border-radius:6px;background:var(--soft)}
/* карточка объекта */
.back{display:flex;align-items:center;gap:2px;height:44px;padding:0 10px 0 2px;border-radius:12px;font-weight:600;color:var(--blue)}
.back:hover{background:var(--soft)}
.oh{margin:4px 0 14px}
.oh h1{font-size:24px;text-wrap:pretty}
.oh .meta{margin-top:6px}
.tabs{display:flex;margin-bottom:16px}.tabs .seg{width:100%}.tabs .seg button{flex:1;justify-content:center;padding:0 8px}
.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:16px}
.box h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin-bottom:10px}
.big{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.big+small{display:block;color:var(--mut);font-size:15px;margin:2px 0 6px}
.fl{display:flex;flex-direction:column;gap:4px;padding:8px 0}
.fl label,.fl .lb{font-size:15px;color:var(--mut);display:flex;justify-content:space-between;gap:8px}
.in{width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--field);border-radius:10px;background:var(--card);font-size:16px;outline:0}
.in:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--bluesoft)}
.in.n{text-align:right;font-variant-numeric:tabular-nums}
.in.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--redsoft)}
textarea.in{resize:vertical;min-height:72px;line-height:1.4}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px}
.rem{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 4px;border-top:1px solid var(--line);margin-top:8px;flex-wrap:wrap}
.rem span{font-size:16px;font-weight:600}
.rem b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-left:auto}
.rem small{width:100%;text-align:right;display:flex;justify-content:flex-end;gap:4px;align-items:center;font-size:15px}
.err-t{color:var(--red);font-size:14px;font-weight:600}
/* цепочка этапов */
.bars{display:flex;gap:3px;margin:2px 0 10px}
.bars i{flex:1;height:8px;border-radius:4px;background:var(--soft)}
.bars i.on{background:var(--blue)}.bars.done i.on{background:var(--green)}.bars.stop i.on{background:var(--amber)}
.cur{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.cur b{font-size:20px}.cur span{color:var(--mut);font-size:15px;white-space:nowrap}
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-left:16px;padding-right:16px}
.steps button{flex:none;white-space:nowrap;height:40px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:15px;color:var(--mut);display:flex;align-items:center;gap:4px}
.steps button svg.i{width:16px;height:16px}
.steps button.ok{color:var(--ink)}
.steps button.cur{background:var(--ink);border-color:var(--ink);color:var(--card);font-weight:700;margin:0}
.steps .stopb{margin-left:6px;color:var(--amber);border-color:var(--amber)}
.steps .stopb.cur{background:var(--amber);border-color:var(--amber);color:#111}
/* лента */
.new{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px}
.new .in{flex:1}
.send{width:48px;height:48px;border-radius:12px;background:var(--redbg);color:#fff;display:grid;place-items:center;flex:none}
.send:disabled{background:var(--soft);color:var(--mut);cursor:default}
.note{display:flex;gap:12px;padding:14px 0}.note+.note{border-top:1px solid var(--line)}
.note .h{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.note .h span{color:var(--mut);font-size:14px}
.note p{margin-top:2px;text-wrap:pretty}
/* клиенты */
.ct .nm{font-size:18px}
.ct .meta{margin:2px 0 10px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.act{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;background:var(--bluesoft);color:var(--blue);font-weight:600;max-width:100%}
.act span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act:hover{text-decoration:none;filter:brightness(.97)}
.ghost{display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;border:1px dashed var(--field);border-radius:var(--r);font-weight:700;color:var(--ink);width:100%}
.btns{display:flex;gap:8px;margin-top:8px}
.pri{min-height:48px;padding:0 20px;border-radius:12px;background:var(--redbg);color:#fff;font-weight:700}
.sec{min-height:48px;padding:0 20px;border-radius:12px;background:var(--soft);font-weight:700}
/* уведомление */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:9;display:flex;align-items:center;gap:10px;background:#111827;color:#fff;border-radius:12px;padding:10px 10px 10px 16px;min-height:48px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600}
[data-theme=d] .toast{background:#F2F5F9;color:#111827}
.toast.bad{background:#B3221A;color:#fff}
.toast button{min-height:36px;padding:0 12px;border-radius:8px;background:rgba(255,255,255,.18);color:inherit;font-weight:700}
.toast.nob{padding-right:16px}
/* планшет */
@media(min-width:700px){
  .bar{padding:8px 24px}
  main{padding:24px 24px 48px}
  .srch{display:flex}.ib.s{display:none}.srow{display:none}
  .add{display:inline-flex}.hd .add{margin-left:auto}.fab{display:none}
  .tot{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,1fr);gap:12px;background:none;border:0;box-shadow:none;padding:0}
  .tot div{flex-direction:column;align-items:flex-start;gap:2px;padding:14px 18px;background:var(--card);border:1px solid var(--line)!important;border-radius:var(--r);box-shadow:var(--sh)}
  .tot b{font-size:26px;text-align:left}
  .toast{bottom:24px}
  .grid.g2{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .grid.g2 .wide{grid-column:1/-1}
  .tabs .seg{width:auto}.tabs .seg button{flex:none;padding:0 18px}
  .oh h1{font-size:28px}
  .steps{flex-wrap:wrap;overflow:visible;margin:0;padding:0}
}
/* строка списка на широких экранах */
@media(min-width:700px){
  .row,.rhead{grid-template-areas:none;grid-template-columns:minmax(0,1fr) 170px 120px 130px 40px;gap:12px;padding:12px 18px}
  .row>*,.rhead>*{grid-area:auto}
  .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
  .sd,.c-id{display:none}
  .c-st{display:block;min-width:0}
  .c-rs{color:var(--ink)}
  .rhead{display:grid;padding-top:0;padding-bottom:4px;color:var(--mut);font-size:14px}
  .rhead .c-re{font-weight:400}
}
@media(min-width:900px){
  .row,.rhead{grid-template-columns:72px minmax(0,1fr) 170px 120px 96px 130px 40px}
  .c-id,.c-du{display:block}
  .c-du{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
}
@media(min-width:1200px){
  .row,.rhead{grid-template-columns:72px minmax(0,2fr) 170px 120px minmax(0,1fr) 96px 130px 130px 40px}
  .c-bl,.c-to{display:block}
  .c-bl{color:var(--mut);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .c-to{font-size:15px;color:var(--mut);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .bw{display:none}
}
/* монитор */
@media(min-width:1100px){
  .who{display:flex}
  .cols{margin:0;padding-left:0;padding-right:0}
  .col{flex-basis:260px}
  .grid.g2{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
}
</style>
</head>

<div id="app"></div>
<script>
const P=new URLSearchParams(location.search);
if(P.get('theme')==='d'||(!P.get('theme')&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='d';
const ic=(n,t)=>`<svg class="i"${t?` aria-label="${t}"`:' aria-hidden="true"'}><use href="#${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rub=n=>(+n||0).toLocaleString('ru-RU',{maximumFractionDigits:0})+'\u00a0₽';
const num=v=>+String(v).replace(/[^\d,.-]/g,'').replace(',','.')||0;
const ST=['Договор','Подготовка','Закупка','Поставка','Монтаж','Испытания и ПНР','Подготовка ИД','Согласование ИД','Сдача','Закрытие расчётов','Завершён','Приостановлен'];
const STOP=11,DONE=10,TODAY=new Date(2026,9,21);
const PEOPLE=['Иванов А.','Петров С.','Сидорова Е.'];
const mk=(id,name,st,resp,block,eq,mo,paid,due,addr,dn,dd)=>({id,name,st,resp,block,eq,mo,paid,due,addr,dn,dd,feed:[],cli:[]});
let OBJ=[
 mk('NF-001','Городская больница №1. Корпус А',7,'Иванов А.','',3200000,1500000,4000000,'2026-11-10','г. Москва, ул. Лесная, 12, корп. А','14/25-ТО','2025-03-14'),
 mk('NF-002','Клиническая больница №2. Блок В',4,'Петров С.','Ждём готовности помещений',6100000,2800000,6500000,'2026-11-30','г. Москва, Каширское ш., 23','22/25','2025-05-02'),
 mk('NF-003','Медицинский центр «Пример». Хранилище',3,'Сидорова Е.','Нет допуска на объект',38000000,7350000,4000000,'2026-10-09','Московская обл., г. Химки, ул. Заводская, 7, стр. 2, помещение 14 (вход со двора)','31/25-П','2025-07-21'),
 mk('NF-004','Поликлиника №4. Архив',2,'Иванов А.','',950000,400000,0,'2026-10-16','г. Москва, ул. Профсоюзная, 41','35/25','2025-09-01'),
 mk('NF-005','Областная больница №5. Серверная',5,'Петров С.','Ждём заказчика на испытания',4300000,2000000,5000000,'2026-12-15','г. Тверь, ул. Советская, 4','38/25','2025-09-18'),
 mk('NF-006','Диагностический центр №6. Склад',8,'Сидорова Е.','',3100000,1000000,4100000,'','г. Москва, ул. Нагорная, 9','40/25','2025-10-03'),
 mk('NF-007','Банк «Северный». Хранилище ценностей',STOP,'Иванов А.','Заказчик остановил финансирование',2400000,900000,1000000,'2026-09-11','г. Санкт-Петербург, Невский пр., 88','44/25','2025-11-12'),
 mk('NF-008','Музей истории города. Фондохранилище',0,'Петров С.','',5600000,2100000,0,'2026-11-25','г. Калуга, ул. Ленина, 3','03/26','2026-10-15'),
];
const o3=OBJ[2];
o3.feed=[
 {a:'Сидорова Е.',t:'Сегодня, 14:20',x:'Охрана не пустила бригаду: пропуска не оформлены. Написала заместителю главврача, обещали до пятницы.'},
 {a:'Иванов А.',t:'Вчера, 09:05',x:'Модули МГП отгружены со склада, ждём на объекте 23.10.'},
 {a:'Петров С.',t:'18 окт, 16:40',x:'Аванс 4 000 000,00 ₽ поступил. Второй платёж по графику — до 09.10, пока нет.'},
];
o3.cli=[
 {f:'Кузнецова Ольга Викторовна',p:'Заместитель главного врача по АХЧ',c:'ООО «Медицинский центр «Пример»',ph:'+7 (916) 204-18-77',em:'kuznetsova@primer-med.ru'},
 {f:'Смирнов Павел',p:'Главный инженер',c:'ООО «Медицинский центр «Пример»',ph:'+7 (495) 640-12-30',em:'p.smirnov@primer-med.ru'},
];
OBJ.forEach(o=>{if(!o.feed.length)o.feed=[{a:o.resp,t:'15 окт, 11:00',x:'Созвонились с заказчиком, сроки подтвердили.'}];if(!o.cli.length)o.cli=[{f:'Орлов Дмитрий',p:'Главный инженер',c:'ГБУЗ «'+o.name.split('.')[0].replace(/«|»/g,'')+'»',ph:'+7 (495) 111-22-33',em:'orlov@example.ru'}]});
const total=o=>(+o.eq||0)+(+o.mo||0), rest=o=>Math.max(0,total(o)-(+o.paid||0));
const late=o=>{if(!o.due||rest(o)<=0)return 0;const d=Math.round((TODAY-new Date(o.due))/864e5);return d>0?d:0};
const stc=st=>st===DONE?'done':st===STOP?'stop':'';
const fd=s=>s?s.split('-').reverse().join('.'):'';

let S={s:['list','stages'].includes(P.get('s'))?P.get('s'):'list',tab:P.get('tab')||'obj',id:P.get('id')||'NF-003',q:'',search:false,addCli:false,toast:null};
const app=document.getElementById('app');
const cur=()=>OBJ.find(o=>o.id===S.id)||OBJ[0];
const go=p=>{Object.assign(S,p);render();window.scrollTo(0,0)};

function bar(){
  const dk=document.documentElement.dataset.theme==='d';
  return `<header class="bar">
   <span class="logo"><img src="nonfire-logo.png" alt="NONFIRE" width="100" height="26"></span><span class="sp"></span>
   ${S.s==='card'?'':`<label class="srch">${ic('search')}<span class="sr">Поиск</span><input id="q" type="search" placeholder="Поиск" value="${esc(S.q)}"></label>
   <button class="ib s" data-a="search" title="Поиск">${ic('search','Поиск')}</button>`}
   <button class="ib" data-a="theme" title="${dk?'Светлая тема':'Тёмная тема'}">${ic(dk?'sun':'moon',dk?'Светлая тема':'Тёмная тема')}</button>
   <span class="who"><span class="ava">Д</span>Демо</span>
  </header>${S.search&&S.s!=='card'?`<div class="srow"><label class="srch">${ic('search')}<input id="q2" type="search" placeholder="Название, ID, адрес" value="${esc(S.q)}"></label></div>`:''}`;
}
function totals(list){
  return `<section class="tot" aria-label="Итоги">
   <div><span>Объектов</span><b>${list.length}</b></div>
   <div><span>По договорам</span><b>${rub(list.reduce((a,o)=>a+total(o),0))}</b></div>
   <div><span>Остаток</span><b class="r">${rub(list.reduce((a,o)=>a+rest(o),0))}</b></div></section>`;
}
const chip=st=>`<span class="chip"><i style="background:var(--s${st})"></i>${ST[st]}</span>`;
const moneyCell=o=>{const r=rest(o),l=late(o);return `<span class="money"><b>${r?rub(r):'Оплачено'}</b>${l?`<small class="od" title="Срок оплаты ${fd(o.due)}">${ic('clock')}${l}&nbsp;дн.</small>`:r?`<small>из ${rub(total(o))}</small>`:''}</span>`};
function head(){
  return `<div class="hd"><h1>Объекты</h1>
   <div class="seg" role="group" aria-label="Вид">
    <button aria-pressed="${S.s==='list'}" data-a="v-list" title="Списком">${ic("list","Списком")}</button>
    <button aria-pressed="${S.s==='stages'}" data-a="v-stages" title="По этапам">${ic("cols","По этапам")}</button></div>
   <button class="add" data-a="new">${ic('add')}Объект</button></div>`;
}
const filt=()=>{const q=S.q.trim().toLowerCase();return q?OBJ.filter(o=>(o.name+o.id+o.addr+o.resp).toLowerCase().includes(q)):OBJ};
function list(){
  const L=filt();
  return head()+totals(L)+`<div class="rhead"><span class="c-id">ID</span><span class="c-nm">Объект</span><span class="c-st">Этап</span><span class="c-rs">Ответственный</span><span class="c-bl">Что мешает</span><span class="c-du">Оплатить до</span><span class="c-to">По договору</span><span class="c-re">Остаток</span><span></span></div><div class="rows">`+
  (L.length?L.map(o=>{const r=rest(o),l=late(o);return `<button class="row" data-open="${o.id}">
    <span class="c-id id">${o.id}</span>
    <span class="c-nm"><i class="sd" style="background:var(--s${o.st})" title="${ST[o.st]}"></i><span class="nm" title="${esc(o.name)}">${esc(o.name)}</span></span>
    <span class="c-st">${chip(o.st)}</span><span class="c-rs">${esc(o.resp)}</span>
    <span class="c-bl" title="${esc(o.block)}">${esc(o.block)||'—'}</span>
    <span class="c-du ${l?'od':''}">${fd(o.due)||'—'}</span>
    <span class="c-to">${rub(total(o))}</span>
    <span class="c-re">${r?rub(r):'Оплачено'}</span>
    <span class="c-ok">${o.block?`<span class="bw" title="${esc(o.block)}">${ic('warn','Что мешает')}</span>`:''}<i class="dot ${l?'late':''}" title="${l?`Просрочка ${l} дн.`:'В графике'}"></i></span>
  </button>`}).join(''):`<div class="none">Ничего не найдено</div>`)+`</div>`;
}
function stages(){
  const L=filt();
  return head()+totals(L)+`<div class="cols">`+ST.map((n,i)=>{const C=L.filter(o=>o.st===i);
   return `<section class="col"><div class="colh" style="border-color:var(--s${i})"><b>${n}<span>${C.length}</span></b><small>${C.length?rub(C.reduce((a,o)=>a+rest(o),0)):'&nbsp;'}</small></div>`+
   (C.length?C.map(o=>{const l=late(o);return `<button class="tile" data-open="${o.id}"><span class="t">${esc(o.name)}</span>
     <span class="meta"><span class="id">${o.id}</span>· ${esc(o.resp)}</span>
     <span class="f"><b>${rest(o)?rub(rest(o)):'Оплачено'}</b><span class="ic">${o.block?`<span title="${esc(o.block)}">${ic('warn','Что мешает')}</span>`:''}${l?`<span class="od" title="Просрочка ${l} дн.">${ic('clock','Просрочка')}</span>`:''}</span></span></button>`}).join(''):`<div class="none">—</div>`)+`</section>`}).join('')+`</div>`;
}
function empty(){return head().replace('<div class="seg"','<div style="display:none" class="seg"')+`<div class="empty"><span class="ci">${ic('bld')}</span><b>Объектов нет</b><button class="add" data-a="new">${ic('add')}Объект</button></div>`}
function load(){return head()+`<div class="tot" aria-busy="true"><div><span>Объектов</span><b>…</b></div><div><span>По договорам</span><b>…</b></div><div><span>Остаток</span><b>…</b></div></div><div class="rows">`+[70,55,80,60].map(w=>`<div class="sk"><i style="width:${w}%;height:18px"></i><i style="width:35%"></i><i style="width:50%;align-self:flex-end;height:18px"></i></div>`).join('')+`</div><span class="sr" role="status">Загрузка</span>`}

function chain(o){
  const st=o.st,n=st===STOP?0:st+1;
  return `<section class="box wide"><h2>Этап</h2>
   <div class="cur"><b>${ST[st]}</b><span>${st===STOP?'':`${Math.min(n,11)} из 11`}</span></div>
   <div class="bars ${stc(st)}">${ST.slice(0,11).map((_,i)=>`<i class="${st===STOP?(i<=2?'on':''):i<=st?'on':''}"></i>`).join('')}</div>
   <div class="steps">${ST.map((s,i)=>`<button data-st="${i}" class="${i===st?'cur':i<st&&st!==STOP?'ok':''} ${i===STOP?'stopb':''}">${i<st&&st!==STOP?ic('check'):''}${s}</button>`).join('')}</div></section>`;
}
const fld=(k,l,v,o={})=>`<div class="fl"><label for="f-${k}">${l}${o.err?'<span class="err-t">Не сохранено</span>':''}</label>${o.ta?`<textarea class="in" id="f-${k}" data-k="${k}" rows="2" placeholder="${o.ph||''}">${esc(v)}</textarea>`:`<input class="in ${o.n?'n':''} ${o.err?'bad':''}" id="f-${k}" data-k="${k}" ${o.type?`type="${o.type}"`:''} ${o.n?'inputmode="decimal"':''} value="${esc(o.n?(+v||0).toLocaleString('ru-RU',{maximumFractionDigits:0}):v)}" placeholder="${o.ph||''}">`}</div>`;
function remHtml(o){const l=late(o);return `<span>Остаток</span><b>${rub(rest(o))}</b>${l?`<small class="od">${ic('clock')}Просрочка ${l}&nbsp;дн. · до ${fd(o.due)}</small>`:''}`}
function tabObj(o){
  return `<div class="grid g2">${chain(o)}
   <section class="box"><h2>Деньги</h2>
    <div class="big" id="tot">${rub(total(o))}</div><small>Всего по договору</small>
    <div class="two">${fld('eq','Оборудование',o.eq,{n:1})}${fld('mo','Монтаж',o.mo,{n:1})}</div>
    <div class="two">${fld('paid','Получено',o.paid,{n:1,err:S.err})}${fld('due','Оплатить до',o.due,{type:'date'})}</div>
    <div class="rem" id="rem">${remHtml(o)}</div></section>
   <div class="grid">
    <section class="box"><h2>Договор</h2><div class="two">${fld('dn','Номер',o.dn)}${fld('dd','Дата',o.dd,{type:'date'})}</div></section>
    <section class="box"><h2>Объект</h2>
     ${fld('block','Что мешает',o.block,{ta:1,ph:'Ничего'})}
     <div class="fl"><label for="f-resp">Ответственный</label><select class="in" id="f-resp" data-k="resp">${PEOPLE.map(p=>`<option${p===o.resp?' selected':''}>${p}</option>`).join('')}</select></div>
     <div class="fl"><span class="lb"><label for="f-addr">Адрес</label>${o.addr?`<a href="https://yandex.ru/maps/?text=${encodeURIComponent(o.addr)}" target="_blank" title="На карте" style="display:flex;align-items:center;gap:4px">${ic('pin')}Карта</a>`:''}</span><textarea class="in" id="f-addr" data-k="addr" rows="2">${esc(o.addr)}</textarea></div>
    </section></div></div>`;
}
function tabFeed(o){
  return `<div class="box" style="max-width:760px"><form class="new" data-f="note"><label class="sr" for="nt">Заметка</label><textarea class="in" id="nt" rows="1" placeholder="Заметка"></textarea><button class="send" title="Добавить" disabled>${ic('send','Добавить')}</button></form>
   ${o.feed.length?o.feed.map(n=>`<article class="note"><span class="ava">${esc(n.a[0])}</span><div><div class="h"><b>${esc(n.a)}</b><span>${esc(n.t)}</span></div><p>${esc(n.x)}</p></div></article>`).join(''):`<div class="none">Заметок нет</div>`}</div>`;
}
function tabCli(o){
  return `<div class="grid g2">`+o.cli.map(c=>`<article class="box ct"><div class="nm">${esc(c.f)}</div><div class="meta">${esc([c.p,c.c].filter(Boolean).join(' · '))}</div>
   <div class="acts">${c.ph?`<a class="act" href="tel:${c.ph.replace(/[^\d+]/g,'')}" title="Позвонить">${ic('call','Позвонить')}<span>${esc(c.ph)}</span></a>`:''}${c.em?`<a class="act" href="mailto:${esc(c.em)}" title="Написать">${ic('mail','Написать')}<span>${esc(c.em)}</span></a>`:''}</div></article>`).join('')+
   (S.addCli?`<form class="box" data-f="cli"><h2>Новый контакт</h2>
     ${[['f','ФИО'],['p','Должность'],['c','Юрлицо'],['ph','Телефон','tel'],['em','Почта','email']].map(([k,l,t])=>`<div class="fl"><label for="c-${k}">${l}</label><input class="in" id="c-${k}" name="${k}" ${t?`type="${t}"`:''} ${k==='f'?'required':''}></div>`).join('')}
     <div class="btns"><button class="pri">Сохранить</button><button type="button" class="sec" data-a="cli-x">Отмена</button></div></form>`
   :`<button class="ghost" data-a="cli-add">${ic('add')}Контакт</button>`)+`</div>`;
}
function card(){
  const o=cur();
  const T=[['obj','Объект'],['feed','Лента',o.feed.length],['cli','Клиенты',o.cli.length]];
  return `<button class="back" data-a="v-list">${ic('back')}Объекты</button>
   <div class="oh"><h1>${esc(o.name)}</h1><div class="meta"><span class="id">${o.id}</span>${chip(o.st)}${late(o)?`<span class="od" style="display:flex;gap:4px;align-items:center">${ic('clock')}${late(o)}&nbsp;дн.</span>`:''}</div></div>
   <div class="tabs"><div class="seg" role="tablist">${T.map(([k,l,n])=>`<button role="tab" aria-pressed="${S.tab===k}" data-tab="${k}">${l}${n?` <span class="n">${n}</span>`:''}</button>`).join('')}</div></div>
   ${S.tab==='feed'?tabFeed(o):S.tab==='cli'?tabCli(o):tabObj(o)}`;
}
function toast(){const t=S.toast;if(!t)return '';return `<div class="toast ${t.bad?'bad':'nob'}" role="status">${t.bad?ic('cloud'):ic('check')}${t.t}${t.bad?'<button data-a="retry">Повторить</button>':''}</div>`}
let tt;
function say(t,bad){S.toast={t,bad};paintToast();clearTimeout(tt);if(!bad)tt=setTimeout(()=>{S.toast=null;paintToast()},2200)}
function paintToast(){document.querySelector('.toast')?.remove();app.insertAdjacentHTML('beforeend',toast())}
function render(){
  const v={list,stages,card,empty,load}[S.s]||list;
  app.innerHTML=bar()+`<main>${v()}</main>`+(['list','stages','empty'].includes(S.s)?`<button class="fab" data-a="new" title="Добавить объект">${ic('add','Добавить объект')}</button>`:'')+toast();
}
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a],[data-open],[data-tab],[data-st]');if(!b)return;
  if(b.dataset.open)return go({s:'card',id:b.dataset.open,tab:'obj',addCli:false});
  if(b.dataset.tab)return go({tab:b.dataset.tab});
  if(b.dataset.st){cur().st=+b.dataset.st;render();return say('Сохранено')}
  const a=b.dataset.a;
  if(a==='theme'){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='d'?'':'d';render()}
  else if(a==='search'){S.search=!S.search;render();document.getElementById('q2')?.focus()}
  else if(a==='v-list')go({s:'list'});else if(a==='v-stages')go({s:'stages'});
  else if(a==='new'){const n=OBJ.length+1,id='NF-'+String(n).padStart(3,'0');OBJ.unshift({...mk(id,'Новый объект',0,PEOPLE[0],'',0,0,0,'','','',''),feed:[],cli:[]});go({s:'card',id,tab:'obj'})}
  else if(a==='cli-add')go({addCli:true});else if(a==='cli-x')go({addCli:false});
  else if(a==='retry'){S.err=false;render();say('Сохранено')}
});
app.addEventListener('input',e=>{
  if(e.target.id==='q'||e.target.id==='q2'){S.q=e.target.value;const p=e.target.selectionStart,id=e.target.id;render();const i=document.getElementById(id);i.focus();i.setSelectionRange(p,p)}
  if(e.target.id==='nt'){e.target.nextElementSibling.disabled=!e.target.value.trim();e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+2+'px'}
});
app.addEventListener('change',e=>{
  const k=e.target.dataset.k;if(!k)return;const o=cur();
  o[k]=['eq','mo','paid'].includes(k)?num(e.target.value):e.target.value;
  if(['eq','mo','paid'].includes(k))e.target.value=o[k].toLocaleString('ru-RU',{maximumFractionDigits:0});
  document.getElementById('tot').textContent=rub(total(o));document.getElementById('rem').innerHTML=remHtml(o);
  if(S.err)return say('Не сохранено',1);say('Сохранено');
});
app.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target,o=cur();
  if(f.dataset.f==='note'){const x=f.querySelector('textarea').value.trim();if(!x)return;o.feed.unshift({a:'Демо',t:'Сейчас',x});render();say('Добавлено')}
  if(f.dataset.f==='cli'){const d=Object.fromEntries(new FormData(f));o.cli.push(d);S.addCli=false;render();say('Добавлено')}
});

render();
</script>
</body>
</html>
